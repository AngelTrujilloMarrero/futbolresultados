version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      # Con 1-2 horas de separación del actualizador de Node.js (05:00 UTC)
      # para no provocar dos despliegues de Vercel solapados.
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    reviewers:
      - "atrujimar"
    labels:
      - "dependencies"
      - "automated"
    groups:
      todas:
        patterns:
          - "*"
